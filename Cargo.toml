[package]
name = "mso"
version = "0.1.0"
edition = "2021"
authors = ["Niraj Kamdar <niraj@metasquare.tech>"]
license = "MIT"
description = "Metasquare Oracle (mso) - High-performance multi-tier oracle microservice for crypto, commodities, and synthetic assets"
repository = "https://github.com/Niraj-Kamdar/mso"
homepage = "https://github.com/Niraj-Kamdar/mso"
readme = "README.md"
keywords = ["oracle", "crypto", "solana", "trading", "grpc"]
categories = ["cryptography::cryptocurrencies", "network-programming", "web-programming"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dashmap = "6.0"
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tokio-stream = "0.1"
thiserror = "1.0"
async-stream = "0.3"
futures-util = "0.3"
toml = "0.9"

[build-dependencies]
tonic-build = "0.12"
