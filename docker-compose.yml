services:
  mso:
    image: ghcr.io/niraj-kamdar/mso:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metasquare-oracle
    restart: unless-stopped
    ports:
      - "4000:4000"    # Axum REST API Gateway & Scalar Interactive Docs
      - "50051:50051"  # Tonic gRPC Streaming & Unary Service
    volumes:
      - mso-data:/data
      # - ./mso.toml:/config/mso.toml:ro   # custom assets / poll frequency
    environment:
      - MSO_HTTP_ADDR=0.0.0.0:4000
      - MSO_GRPC_ADDR=0.0.0.0:50051
      - MSO_DB_PATH=/data/oracle.db
      - RUST_LOG=info
      # - MSO_CONFIG=/config/mso.toml
    healthcheck:
      test: ["CMD", "/usr/local/bin/mso", "health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mso-data:
    driver: local
