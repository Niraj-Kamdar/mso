# mso configuration. This file is the built-in default.
# Start with `mso serve --config mso.toml` (or MSO_CONFIG=mso.toml).
# A custom file only needs the keys it changes. Tables merge key by key;
# `assets` is replaced as a whole when present.

# Poll frequency (seconds) for each REST source. `binance-ws` is a push
# stream (~1s) and has no interval.
[poll_secs]
binance = 60
hyperliquid = 60
jupiter = 60
yahoo = 60
uniswap = 60

[retention]
ticks_hours = 24
candles_1m_days = 7
candles_1h_days = 90

# Source-specific settings.
#
# uniswap: on-chain Uniswap V3 TWAP read via `observe()` on Ethereum mainnet.
#   Requires MSO_ETH_RPC_URL (or ETH_RPC_URL, a mainnet JSON-RPC endpoint) in the environment.
#   Non-loopback endpoints must use HTTPS.
#   twap: look-back window for the time-weighted average price.
#         "hot" (1 min) | "warm" (10 min) | "cool" (30 min) | "cold" (1 hour)
#         | { custom = <seconds> }   (1 .. 604800)
#   Longer windows are harder to manipulate but lag spot. The leg that uses
#   uniswap can override it: `twap = ...` on the asset when uniswap is the
#   primary source, or inside `fallback = { source = "uniswap", ..., twap = ... }`.
[feeds.uniswap]
twap = "warm"

# One entry per served symbol.
#   source: binance-ws | binance | hyperliquid | jupiter | yahoo | uniswap
#   id:     identifier at that source:
#           binance pair (SOLUSDT), hyperliquid coin (HYPE),
#           Solana mint (jupiter), ticker (yahoo),
#           V3 pool contract address (uniswap) - the price is token0 quoted
#           in token1, so pick a pool whose token order matches the symbol.
#   fallback (optional): another source + id used only while the primary
#           price is older than max(2 x primary resolution, 5s).
#           Hyperliquid fallbacks are perp mid prices (small basis vs spot).

[[assets]]
symbol = "SOL/USD"
source = "binance-ws"
id = "SOLUSDT"
fallback = { source = "hyperliquid", id = "SOL" }

[[assets]]
symbol = "BTC/USD"
source = "binance"
id = "BTCUSDT"
fallback = { source = "hyperliquid", id = "BTC" }

[[assets]]
symbol = "ETH/USD"
source = "binance"
id = "ETHUSDT"
fallback = { source = "hyperliquid", id = "ETH" }

[[assets]]
symbol = "ZEC/USD"
source = "binance"
id = "ZECUSDT"
fallback = { source = "hyperliquid", id = "ZEC" }

[[assets]]
symbol = "PAXG/USD"
source = "binance"
id = "PAXGUSDT"
fallback = { source = "jupiter", id = "5GgRAEmv8ZxF2PR5hY72Qs5x1bnQ6UK2RbTPoqJ3wSwW" } # native Paxos PAXG

[[assets]]
