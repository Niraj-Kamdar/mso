# Custom mso config: Jupiter is primary for every asset (full-precision float, ~2s).
# Fallbacks: crypto/PAXG -> Binance (SOL via the WS stream), xStocks -> Yahoo.
# Run: mso serve --config mso.toml   (or MSO_CONFIG=mso.toml)

# One shared Jupiter interval = one batched call for all 11 ids (lite-api.jup.ag,
# mso's default). Deployed at 2s; 1s tested clean on lite-api (keyless api.jup.ag
# 429s at 1s). Binance and Yahoo REST are fallback-only (fetched just while a
# Jupiter price is stale), so a 5s poll is cheap and fails over fast.
[poll_secs]
jupiter = 2
binance = 5
yahoo = 5
uniswap = 30

# Ethereum mainnet via Uniswap V3 TWAP. Needs MSO_ETH_RPC_URL (or ETH_RPC_URL) in the environment
# (startup fails without it while a uniswap asset is configured). Non-loopback endpoints must use HTTPS.
[feeds.uniswap]
twap = "warm"        # hot (1m) | warm (10m) | cool (30m) | cold (1h) | { custom = <secs> }

# `assets` replaces the default list as a whole, so every symbol is restated.
[[assets]]
symbol = "SOL/USD"
source = "jupiter"
id = "So11111111111111111111111111111111111111112"
fallback = { source = "binance", id = "SOLUSDT" }

